services:
  logger.channel.xedc_home:
    parent: logger.channel_base
    arguments: ['xedc_home']

  xedc_home.cache_subscriber:
    class: Drupal\xedc_home\EventSubscriber\HomeCacheSubscriber
    arguments: ['@datetime.time', '@current_user', '@path.matcher']
    tags:
      - { name: event_subscriber }

  xedc_home.cards:
    class: Drupal\xedc_home\HomeCards
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@file_url_generator'
      - '@date.formatter'
      - '@entity_field.manager'
      - '@logger.channel.xedc_home'

xedc_models.page:
  path: '/models'
  defaults:
    _controller: '\Drupal\xedc_models\Controller\ModelsController::page'
    _title: '模特'
  requirements:
    _permission: 'access content'

xedc_models.detail:
  path: '/models/{taxonomy_term}'
  defaults:
    _controller: '\Drupal\xedc_models\Controller\ModelsController::detail'
    _title_callback: '\Drupal\xedc_models\Controller\ModelsController::detailTitle'
  requirements:
    _permission: 'access content'
    taxonomy_term: '\d+'
  options:
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term

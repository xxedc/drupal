xedc_member.overview:
  path: '/member'
  defaults:
    _controller: '\Drupal\xedc_member\Controller\MemberController::overview'
    _title: '会员中心'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

xedc_member.favorites:
  path: '/member/favorites'
  defaults:
    _controller: '\Drupal\xedc_member\Controller\MemberController::favorites'
    _title: '我的收藏'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

xedc_member.history:
  path: '/member/history'
  defaults:
    _controller: '\Drupal\xedc_member\Controller\MemberController::history'
    _title: '浏览历史'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

xedc_member.history_clear:
  path: '/member/history/clear'
  defaults:
    _form: '\Drupal\xedc_member\Form\HistoryClearForm'
    _title: '清空浏览历史'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE


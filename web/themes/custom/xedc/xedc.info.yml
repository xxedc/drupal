name: xedc
description: "xedc theme based on <a href='https://www.drupal.org/project/radix' target='_blank'>Radix 6.x</a> and Bootstrap 5.x"
screenshot: screenshot.png
'alt text': 'xedc theme screenshot'
core_version_requirement: ^11
engine: twig
type: theme
'base theme': radix
'interface translation project': xedc
'interface translation server pattern': themes/custom/xedc/translations/%language.po
